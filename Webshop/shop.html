<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1" name="viewport" />
  <title>Webshop Korio</title>
  <link rel="stylesheet" href="style.css">
  <script src="products.js" defer></script>
  <script src="main.js" defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
</head>
<body>
  <header class="header shop-header">
    <a class="shop-brand" href="index.html" aria-label="Korio homepage">KORIO</a>
    <form class="searchbar">
      <input type="text" name="q" placeholder="Search..." required>
      <button type="submit"><i class="fas fa-search"></i></button>
    </form>
    <button type="button" class="cart-button" id="cartButton" aria-label="Open shopping cart">
      <div class="cart" aria-label="Shopping cart with 0 items" title="Shopping cart">
        <i class="fas fa-shopping-cart" aria-hidden="true"></i>
        <div class="cart__badge" aria-live="polite" aria-atomic="true" id="cart-count">0</div>
      </div>
    </button>
  </header>
  <main class="main-container">
    <div class="shop-sidebar">
      <aside class="filter">
        <label for="price-filter" class="filter__label">Filter by Price:</label>
        <select id="price-filter" class="filter__select">
          <option value="all">All</option>
          <option value="2.5">Under €2.50</option>
          <option value="5">Under €5</option>
          <option value="10">Under €10</option>
          <option value="15">Under €15</option>
          <option value="25">Under €25</option>
          <option value="50">Under €50</option>
          <option value="75">Under €75</option>
          <option value="100">Under €100</option>
          <option value="100+">€100+</option>
        </select>
      </aside>
      <a class="shop-home-link" href="index.html">Homepage</a>
    </div>
    <section class="products" aria-label="Product list"></section>
  </main>
  <footer class="shop-footer">
    <div class="shop-footer__content">
      <div>
        <a class="shop-footer__brand" href="index.html">KORIO</a>
        <p>Manga, figures and anime favourites.</p>
      </div>
      <nav class="shop-footer__links" aria-label="Footer navigation">
        <a href="index.html">Homepage</a>
      </nav>
    </div>
  </footer>
  <dialog class="product-dialog" id="productDialog" aria-labelledby="productDialogTitle">
    <button class="product-dialog__close" type="button" aria-label="Close product details">×</button>
    <img class="product-dialog__img" id="productDialogImage" alt="">
    <div class="product-dialog__details">
      <p class="product-dialog__availability" id="productDialogAvailability"></p>
      <h2 id="productDialogTitle"></h2>
      <p class="product-dialog__price" id="productDialogPrice"></p>
      <p class="product-dialog__description" id="productDialogDescription"></p>
      <button class="product__button product-dialog__add" id="productDialogAdd" type="button">Add to cart</button>
    </div>
  </dialog>
</body>
</html>
